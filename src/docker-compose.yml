networks:
  network_1:
    driver: bridge

services:
  web:
    container_name: web
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "4001:80"
    networks:
      - "network_1"

  api:
    container_name: api
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "4002:3000"
    networks:
      - "network_1"
